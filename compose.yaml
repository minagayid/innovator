services:
  innovator:
    build:
      context: .
      dockerfile: Dockerfile
    image: innovator:local
    restart: unless-stopped
    init: true
    ports:
      # PORT controls the host-side port; Compose keeps the app on 3000 internally.
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6.1-sol}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.8-flash}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      GOOGLE_ALLOWED_EMAILS: "${GOOGLE_ALLOWED_EMAILS:-}"
      AUTH_SESSION_SECRET: "${AUTH_SESSION_SECRET:-}"
      AUTH_TRUST_CHATGPT_HEADERS: "${AUTH_TRUST_CHATGPT_HEADERS:-false}"
      DISCLOSURE_RATE_LIMIT_HMAC_SECRET: "${DISCLOSURE_RATE_LIMIT_HMAC_SECRET:-}"
      DISCLOSURE_TRUST_CF_EDGE: "${DISCLOSURE_TRUST_CF_EDGE:-false}"
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: /app/.wrangler/logs
      MINIFLARE_REGISTRY_PATH: /app/.wrangler/registry
    volumes:
      - innovator_state:/app/.wrangler/state
      - innovator_registry:/app/.wrangler/registry
      - innovator_logs:/app/.wrangler/logs
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 20s

volumes:
  innovator_state:
  innovator_registry:
  innovator_logs:
