name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Install pinned pnpm without Corepack signature drift
        run: npm install --global pnpm@10.8.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run build and tests
        run: pnpm test
      - name: Run lint checks
        run: pnpm lint
      - name: Build Docker image
        run: docker build --tag innovator:ci .
      - name: Build Vercel container image
        run: docker build --file Dockerfile.vercel --tag innovator:vercel-ci .

      - name: Smoke-test generic OCI and Vercel containers
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f innovator-smoke innovator-vercel-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name innovator-smoke -p 127.0.0.1:18080:8080 innovator:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/innovator-home.html; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' innovator-smoke)" != "true" ]; then
              docker logs innovator-smoke
              exit 1
            fi
            sleep 1
          done
          grep -Eiq 'Innovator|Invention Generation Studio|invention' /tmp/innovator-home.html
          curl -fsS http://127.0.0.1:18080/api/session >/tmp/innovator-session.json
          node -e 'const fs=require("node:fs");const assert=require("node:assert/strict");assert.deepEqual(JSON.parse(fs.readFileSync("/tmp/innovator-session.json","utf8")),{user:null})'
          docker run -d --name innovator-vercel-smoke -p 127.0.0.1:18081:8080 -e PORT=8080 innovator:vercel-ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ >/tmp/innovator-vercel-home.html; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' innovator-vercel-smoke)" != "true" ]; then
              docker logs innovator-vercel-smoke
              exit 1
            fi
            sleep 1
          done
          grep -Eiq 'Innovator|Invention Generation Studio|invention' /tmp/innovator-vercel-home.html
          curl -fsS http://127.0.0.1:18081/api/session >/tmp/innovator-vercel-session.json
          node -e 'const fs=require("node:fs");const assert=require("node:assert/strict");assert.deepEqual(JSON.parse(fs.readFileSync("/tmp/innovator-vercel-session.json","utf8")),{user:null})'

